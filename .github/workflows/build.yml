name: Build TelegramFix

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos + ldid
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          brew install ldid

      - name: Download iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          cp -rn sdks-master/*.sdk $THEOS/sdks/ 2>/dev/null || true

      - name: Build .deb
        run: |
          make clean package

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: TelegramFix-armv7-arm64
          path: packages/*.deb
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
